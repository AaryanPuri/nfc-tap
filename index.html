<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aaryan Puri</title>
  <meta name="description" content="Tap received. Aaryan Puri's links, locked on.">
  <meta property="og:title" content="Aaryan Puri">
  <meta property="og:description" content="Tap received. Links locked on.">
  <meta name="theme-color" content="#02030a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1626'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%235cb2ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #0a1626;
      --paper: #faf7f3;
      --dim: #a9bdd1;
      --blue: #5cb2ff;
      --gold: #e6b450;
      --glass: rgba(4, 8, 22, .66);
      --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; }

    html { background: var(--night); -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100svh;
      color: var(--paper);
      background: linear-gradient(#02030a 45%, #0a1228 78%, #4a2412);
      font: 400 13px/1.45 var(--mono);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    a { color: inherit; text-decoration: none; }

    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: pan-y;
    }

    /* Pre-rendered scene for devices with no WebGL. */
    #poster {
      display: none;
      position: fixed;
      inset: 0;
      background: url(poster-tall.jpg) 65% top / auto 100% no-repeat;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    }

    .scaled .hud {
      right: auto;
      width: calc((100% - 32px) / var(--z));
      transform: scale(var(--z));
      transform-origin: 0 0;
    }

    .scaled .targets {
      position: absolute;
      top: 0;
      left: 0;
      transform: scale(var(--z));
      transform-origin: 0 0;
    }

    .scaled .panel {
      width: calc((100vw - 32px) / var(--z));
      transform: scale(var(--z));
      transform-origin: 0 100%;
    }

    .no-webgl body { background: #02030a; }
    .no-webgl #sky { display: none; }
    .no-webgl #poster { display: block; }

    @media (min-aspect-ratio: 1/1) {
      #poster { background-image: url(poster-wide.jpg); background-position: 64% top; }
    }

    /* Telemetry */
    .hud {
      position: fixed;
      z-index: 1;
      top: max(14px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      color: var(--blue);
      font-size: 11px;
      letter-spacing: .08em;
      text-shadow: 0 0 8px rgba(0, 0, 0, .6);
      text-transform: uppercase;
      pointer-events: none;
      animation: boot .5s .9s both;
    }

    .hud b { display: block; color: var(--paper); font-size: 15px; font-variant-numeric: tabular-nums; }
    .hud div:last-child { text-align: right; }

    /* Scrolls over the fixed sky on short screens. */
    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-start;
      min-height: 100svh;
      padding: 0 16px max(14px, env(safe-area-inset-bottom));
      overflow: hidden;
      pointer-events: none;
    }

    .panel {
      width: min(100%, 420px);
      pointer-events: auto;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 3px;
      color: var(--blue);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 0, 0, .7);
      animation: boot .4s 1.1s both;
    }

    .tick { flex: none; width: 15px; height: 15px; }

    h1 {
      font: 800 clamp(34px, 11vw, 44px)/1.05 'Archivo', system-ui, sans-serif;
      letter-spacing: -.01em;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .85);
      animation: boot .4s 1.2s both;
    }

    .role {
      margin-bottom: 10px;
      color: var(--paper);
      font-size: 12px;
      text-shadow: 0 0 4px #000, 0 1px 10px #000;
      animation: boot .4s 1.3s both;
    }

    /* Link cards, placed down the left side by hero.js. */
    .target {
      position: absolute;
      display: block;
      min-height: 48px;
      padding: 7px 16px 7px 8px;
      background: rgba(4, 8, 22, .72);
      border: 1px solid rgba(92, 178, 255, .55);
      clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 11px 100%, 0 calc(100% - 11px));
      pointer-events: auto;
      animation: lock .4s calc(1.5s + var(--i) * .15s) both;
      transition: background .12s, color .12s;
    }

    .target::after {
      content: '↗';
      position: absolute;
      top: 13px;
      right: 8px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
    }

    .target b { display: block; font-size: 13px; letter-spacing: .04em; line-height: 1.3; }
    .target small { display: block; overflow: hidden; color: var(--dim); font-size: 10px; line-height: 1.25; white-space: nowrap; text-overflow: ellipsis; }

    .target:hover, .target:active { color: var(--night); background: var(--blue); }
    .target:hover small, .target:active small,
    .target:hover::after, .target:active::after { color: var(--night); }

    .actions {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 6px;
      animation: boot .4s 2s both;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      color: var(--paper);
      background: var(--glass);
      border: 1px solid rgba(92, 178, 255, .5);
      font: 700 12px/1 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .12s, color .12s;
    }

    .btn-solid { color: var(--night); background: var(--blue); border-color: var(--blue); }
    .btn:hover, .btn:active { color: var(--night); background: var(--paper); }

    /* Links and name share a left column; the hero takes the right. */
    @media (min-width: 900px) and (orientation: landscape) {
      .stage { padding-left: 12vw; padding-bottom: 7vh; }
      .panel { width: 340px; }
      .target { padding: 10px 18px 10px 12px; }
      .target b { font-size: 15px; }
      .target small { font-size: 11px; }
    }

    @media (max-width: 380px) {
      .target b { font-size: 12px; }
      .target small { font-size: 9px; }
      .target::after { right: 6px; }
    }

    @keyframes boot {
      from { opacity: 0; }
    }

    @keyframes lock {
      0% { opacity: 0; transform: scale(1.14); }
      55% { opacity: 1; transform: scale(.98); }
      70% { opacity: .5; }
      100% { opacity: 1; transform: none; }
    }

    /* Too short for the left column, such as a phone on its side: use a tidy grid. */
    .compact .stage { align-items: flex-end; justify-content: center; }
    .compact .targets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      width: min(100%, 460px);
      margin-bottom: 8px;
    }
    .compact .target { position: relative; left: auto !important; top: auto !important; width: auto !important; }
    .compact .panel { text-align: left; width: min(100%, 460px); }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div id="poster" aria-hidden="true"></div>

  <div class="hud" aria-hidden="true">
    <div>Altitude<b id="alt">12,000 FT</b></div>
    <div><span id="zone">Troposphere</span><b id="mach">MACH 0.9</b></div>
  </div>

  <main class="stage">
    <nav class="targets" aria-label="Aaryan's links">
      <a class="target" id="t-linkedin" style="--i:0" href="https://www.linkedin.com/in/aaryanpuri"><b>LINKEDIN</b><small>in/aaryanpuri</small></a>
      <a class="target" id="t-x" style="--i:1" href="https://x.com/Aaryan_75"><b>X</b><small>@Aaryan_75</small></a>
      <a class="target" id="t-portfolio" style="--i:2" href="https://aaryanpuri.me"><b>PORTFOLIO</b><small>aaryanpuri.me</small></a>
      <a class="target" id="t-github" style="--i:3" href="https://github.com/AaryanPuri"><b>GITHUB</b><small>AaryanPuri</small></a>
    </nav>

    <div class="panel" id="panel">
      <p class="kicker">
        Tap received
        <svg class="tick" viewBox="0 0 24 24" role="img" aria-label="Verified">
          <path fill="#5cb2ff" d="M12 1.5l2.6 1.9 3.2-.2 1.2 3 2.7 1.7-.8 3.1.8 3.1-2.7 1.7-1.2 3-3.2-.2-2.6 1.9-2.6-1.9-3.2.2-1.2-3-2.7-1.7.8-3.1-.8-3.1 2.7-1.7 1.2-3 3.2-.2z"/>
          <path fill="none" stroke="#0a1626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M7.5 12.3l3 3 6-6.3"/>
        </svg>
      </p>
      <h1>Aaryan Puri</h1>
      <p class="role">Jr. Python Developer<br>Pune, Maharashtra, India</p>
      <div class="actions">
        <a class="btn btn-solid" href="aaryan-puri.vcf">Save contact</a>
        <button class="btn" id="share" type="button">Share</button>
      </div>
    </div>
  </main>

  <script src="vendor/three.min.js"></script>
  <script src="hero-image.js"></script>
  <script src="hero.js"></script>
  <script>
    document.getElementById('share').addEventListener('click', function () {
      var button = this;
      var url = location.href.split('#')[0];
      if (navigator.share) {
        navigator.share({ title: 'Aaryan Puri', url: url }).catch(function () {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(function () {
          button.textContent = 'Copied';
          setTimeout(function () { button.textContent = 'Share'; }, 1600);
        }, function () {});
      }
    });
  </script>
</body>
</html>
